# Temporary: builds the Android app once and keeps it in a draft release
# (visible only to the owner) so it can be signed with the AK key outside
# GitHub. Removed afterwards.
name: APK once

on:
  push:
    branches: [apk-temp]

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --release
      - name: Keep it in a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create apk-temp-draft build/app/outputs/flutter-apk/app-release.apk \
            --draft --target "$GITHUB_SHA" \
            --title "Temporary build" --notes "Temporary, removed shortly."
