# Temporary: adds the version 19 Android app, signed with the AK key, to
# the v19 release so it can be downloaded on a phone. The app is the one
# this workflow built (draft "apk-v19-draft"); .github/apk-temp holds only
# what the AK signature adds to it (no key). Removed afterwards.
name: APK once

on:
  push:
    branches: [claude/project-thread-g7diez]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the build
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            -o built.apk "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/698527747"
          echo "24a2a5a9b784935a67969d42934864a534bebad7e46fe9035490a0761b0b2423  built.apk" | sha256sum -c -
      - name: Add the AK signature
        run: python3 .github/apk-temp/join.py built.apk .github/apk-temp/ak-signature.tail AK-System-android.apk
      - name: The app is exactly the one signed and checked with the AK key
        run: |
          echo "868afa5db12209c3503b3b13865b3d43dde1cd7fc27f607096f08c171f2d4877  AK-System-android.apk" | sha256sum -c -
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$tools/apksigner" verify --verbose --print-certs AK-System-android.apk | grep -E "Verifies|scheme|DN|SHA-256"
      - name: Wait for the v19 release
        run: |
          for i in $(seq 1 60); do
            if gh release view v19 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
            sleep 30
          done
          echo "::error::Release v19 did not appear"; exit 1
      - name: Add it to the v19 release
        run: gh release upload v19 AK-System-android.apk --clobber --repo "$GITHUB_REPOSITORY"
