# Temporary: checks the apps can reach the AK cloud database with the
# publishable key built into them (the key is meant to be public).
name: Cloud check once

on:
  push:
    branches: [apk-temp]

permissions:
  contents: read

jobs:
  cloud:
    runs-on: ubuntu-latest
    env:
      URL: https://bycnaevdqprmnrypwebq.supabase.co
      KEY: sb_publishable_oClYmgvGhotBFJCt2aQ_lQ_GgsKz_KW
    steps:
      - name: The database answers with the key the apps send
        run: |
          # The app sends the key as apikey and, before sign-in, as the bearer.
          curl -sS -w '\nHTTP %{http_code}\n' -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL/rest/v1/stages?select=id&limit=1"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL/rest/v1/stages?select=id&limit=1")
          test "$code" = 200
      - name: Sign-in settings
        run: |
          curl -sS -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL/auth/v1/settings" | jq '{external_email: .external.email, mailer_autoconfirm, disable_signup}'
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "apikey: $KEY" -H "Authorization: Bearer $KEY" "$URL/auth/v1/settings")
          test "$code" = 200
