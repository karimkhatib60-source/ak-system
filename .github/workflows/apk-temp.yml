# Temporary: adds the version 15 Android app, signed with the AK key, to
# the v15 release so it can be downloaded on a phone. The app is the one
# this workflow built (draft "apk-v15-draft"); .github/apk-temp holds only
# what the AK signature adds to it (no key). Removed afterwards.
name: APK once

on:
  push:
    branches: [apk-temp]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the build
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            -o built.apk "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/653686070"
          echo "33442d66c08f5f6599fd228752cf6cecf1f66954ca58a7483b2ee0008d4655d2  built.apk" | sha256sum -c -
      - name: Add the AK signature
        run: python3 .github/apk-temp/join.py built.apk .github/apk-temp/ak-signature.tail AK-System-android.apk
      - name: The app is exactly the one signed and checked with the AK key
        run: |
          echo "260a45f27382b34919e2d6e69cec510d5d12b2639d3901f19eb97c34857ff255  AK-System-android.apk" | sha256sum -c -
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$tools/apksigner" verify --verbose --print-certs AK-System-android.apk | grep -E "Verifies|scheme|DN|SHA-256"
      - name: Wait for the v15 release
        run: |
          for i in $(seq 1 60); do
            if gh release view v15 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
            sleep 30
          done
          echo "::error::Release v15 did not appear"; exit 1
      - name: Add it to the v15 release
        run: gh release upload v15 AK-System-android.apk --clobber --repo "$GITHUB_REPOSITORY"
