# Builds the Android app and the Windows app on every push.
# A release: raise appVersion in lib/app_version.dart (and version: in
# pubspec.yaml), write release-notes.md, and push to main. When main has a
# version that has no release yet, both apps are built and one Release
# v<appVersion> is published with the Windows installer (and the APK once
# it is signed); the installed Windows app finds it and offers it.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Runs on the same branch wait for each other, so a version is released once.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

# Only the release job may write to the repository.
permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: The app version, and whether it is new
        id: version
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          v=$(sed -n 's/^const appVersion = \([0-9]*\);/\1/p' lib/app_version.dart)
          p=$(sed -n 's/^version: \([0-9]*\)\..*/\1/p' pubspec.yaml)
          n=$(head -n 1 release-notes.md | tr -d '\r')
          if [ -z "$v" ] || [ "$p" != "$v" ] || [ "$n" != "Version $v" ]; then
            echo "::error::appVersion ($v), the pubspec version ($p) and the first line of release-notes.md ('$n') must agree"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          release=false
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            if [ -z "$(git ls-remote --tags origin "refs/tags/v$v")" ]; then
              release=true
              if [ "$PRIVATE" = true ]; then
                echo "::error::The Windows app downloads updates without a login, so this repository must be public."
                exit 1
              fi
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version $v, release: $release"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Set up signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload.jks
            printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEYSTORE_PASSWORD" > android/key.properties
            echo "apk=AK-System-android.apk" >> "$GITHUB_OUTPUT"
          else
            # A temporary key could never update an earlier install, so this
            # APK keeps another name and is left out of the release.
            echo "::warning::No signing key secret set; the APK is signed with a temporary key and is not released."
            echo "apk=AK-System-android-unsigned.apk" >> "$GITHUB_OUTPUT"
          fi
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk ${{ steps.signing.outputs.apk }}
      - uses: actions/upload-artifact@v4
        with:
          name: AK-System-android
          path: ${{ steps.signing.outputs.apk }}

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The app looks for updates in the repository that built it.
      - run: flutter build windows --release --dart-define=AK_RELEASE_REPO=${{ github.repository }}
      - name: Add the Visual C++ runtime
        shell: pwsh
        # Shipped next to the exe so the app starts on a laptop without the
        # Visual C++ redistributable (installing that would need admin).
        run: |
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" build\windows\x64\runner\Release\ -ErrorAction Stop
          }
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath AK-System-windows.zip
      - name: Build the installer
        shell: pwsh
        run: |
          $version = (Select-String -Path lib/app_version.dart -Pattern '^const appVersion = (\d+);').Matches[0].Groups[1].Value
          function Find-Iscc {
            Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup --version=6.7.1 -y --no-progress
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw 'Inno Setup 6 is not available' }
          & $iscc "/DAppVersion=$version" windows\installer\ak_system.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item dist\AK-System-Setup.exe AK-System-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: AK-System-windows
          path: |
            AK-System-Setup.exe
            AK-System-windows.zip

  # One Release, published only when both apps are built, so the Windows
  # app never sees a release without its installer.
  release:
    needs: [test, android, windows]
    if: needs.test.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: v${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: The Windows installer was built
        run: test -f out/AK-System-Setup.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Version ${{ needs.test.outputs.version }}
          body_path: release-notes.md
          make_latest: true
          # The APK is there only when it was signed with the AK key.
          fail_on_unmatched_files: false
          files: |
            out/AK-System-Setup.exe
            out/AK-System-android.apk
      - name: The Windows app can see the release
        # Asked without a login, as the app asks.
        run: |
          for try in 1 2 3; do
            sleep 15
            if curl -fsS "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" |
              jq -e --arg t "$TAG" '.tag_name == $t and any(.assets[]; .name == "AK-System-Setup.exe")'; then
              exit 0
            fi
          done
          echo "::error::The latest release is not $TAG with AK-System-Setup.exe, as seen without a login"
          exit 1
